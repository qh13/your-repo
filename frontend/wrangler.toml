name = "jable-frontend"
compatibility_date = "2025-01-01"

[build]
command = "npm run build"
cwd = "frontend"

pages_build_output_dir = ".next/server/app"
functions_directory = "functions"

# Pages Functions 配置
[[functions]]
route = "/videos/*"
script = "videos/[id].js"

# Headers 配置
[[headers]]
for = "/_next/static/**"
[headers.values]
Cache-Control = "public, max-age=31536000"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000"
Content-Type = "application/javascript"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000"
Content-Type = "text/css"
X-Content-Type-Options = "nosniff"
